name: Gerar APK - Diario de Vidro
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      -       - name: Preparar projeto
        run: |
          rm -rf build_project
          mkdir -p build_project
          ZIP=$(ls *.zip | head -n 1)
          unzip -o "$ZIP" -d build_project
          echo "=== arquivos ==="
          ls -la build_project/
          GRADLEW=$(find build_project -name "gradlew" | head -n 1)
          echo "Gradlew found: $GRADLEW"
          if [ -n "$GRADLEW" ]; then
            PROJ=$(dirname "$GRADLEW")
          else
            SETTINGS=$(find build_project -name "settings.gradle*" | head -n 1)
            echo "Settings found: $SETTINGS"
            PROJ=$(dirname "$SETTINGS")
          fi
          if [ -z "$PROJ" ] || [ "$PROJ" = "." ]; then PROJ="build_project"; fi
          echo "PROJECT_DIR=$PROJ" >> $GITHUB_ENV
          echo "Usando PROJ=$PROJ"
          ls -la "$PROJ"/
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: diario-de-vidro-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
