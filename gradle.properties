plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android' version '1.9.24'
}

android {
    namespace 'com.diariodevidro.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.diariodevidro.app'
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
