name: Gerar APK - Diário de Vidro

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do projeto
        uses: actions/checkout@v4

      - name: Preparar projeto
        run: |
          mkdir -p build_project
          unzip -q diario_de_vidro_android_v1_notificacoes.zip -d build_project
          PROJECT_DIR=$(find build_project -maxdepth 2 -name settings.gradle.kts -printf '%h\n' | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "Projeto Android não encontrado dentro do ZIP."
            find build_project -maxdepth 3 -type f | head -100
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Dar permissão ao Gradle
        working-directory: ${{ env.PROJECT_DIR }}
        run: chmod +x gradlew

      - name: Gerar APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: DiarioDeVidro-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
